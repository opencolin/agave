<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music · Agave Lounge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero" style="background-image:url(assets/hero-music.jpg)">
    <h1>Music</h1>
  </section>

  <section class="section band">
    <div class="wrap narrow">
      <h2>Listen</h2>
      <p>Sets recorded live in the dome. Press play to listen right here.</p>
      <div class="tracks">
        <div class="track">
          <h3>Lou E. Bagels · Burning Man 2023</h3>
          <iframe title="Lou E. Bagels – Burning Man 2023 Agave Lounge" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1614650184&color=%231b1f3b&show_comments=false&show_reposts=false&visual=false"></iframe>
        </div>
        <div class="track">
          <h3>Brunchlife · Burning Man 2022</h3>
          <iframe title="Brunchlife – Live at Agave Lounge, Burning Man 2022" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1362864214&color=%231b1f3b&show_comments=false&show_reposts=false&visual=false"></iframe>
        </div>
        <div class="track">
          <h3>Geeps · Burning Man 2022</h3>
          <iframe title="Geeps – Burning Man 2022" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1343472679&color=%231b1f3b&show_comments=false&show_reposts=false&visual=false"></iframe>
        </div>
        <div class="track">
          <h3>Bear Foot Sound · Crisis Averted · Burning Man 2022</h3>
          <iframe title="Bear Foot Sound – Crisis Averted at Agave Lounge, Burning Man 2022" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1340877079&color=%231b1f3b&show_comments=false&show_reposts=false&visual=false"></iframe>
        </div>
        <div class="track">
          <h3>PALOMA · Live at Agave Lounge</h3>
          <iframe title="PALOMA – Burning Man Live at Agave Lounge" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1338929482&color=%231b1f3b&show_comments=false&show_reposts=false&visual=false"></iframe>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <h2>2023 Music</h2>
      <figure class="photo poster" style="max-width:720px;margin:0 auto"><img src="assets/music-2023.jpg" alt="2023 DJ lineup"></figure>
    </div>
  </section>

  <section class="section band">
    <div class="wrap">
      <h2>2022 Music</h2>
      <figure class="photo poster" style="max-width:720px;margin:0 auto"><img src="assets/music-2022.jpg" alt="2022 DJ lineup"></figure>
    </div>
  </section>

  <script src="site.js"></script>
</body>
</html>
